<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <style>
      .bg { fill: #FEF7FF; }
      .surface { fill: #FFFFFF; }
      .surfaceVariant { fill: #E7E0EC; }
      .onSurface { fill: #1D1B20; }
      .onSurfaceVariant { fill: #49454F; }
      .primary { fill: #6750A4; }
      .onPrimary { fill: #FFFFFF; }
      .outline { fill: none; stroke: #79747E; stroke-width: 1; }
      .divider { fill: none; stroke: #CAC4D0; stroke-width: 1; }
      .titleS { font-size: 18px; fill: #1D1B20; }
      .titleM { font-size: 20px; fill: #1D1B20; font-weight: 500; }
      .body { font-size: 16px; fill: #1D1B20; }
      .bodyS { font-size: 13px; fill: #49454F; }
      .label { font-size: 11px; fill: #49454F; }
      .device { fill: none; stroke: #C0C0C0; stroke-width: 2; }
      .caption { font-size: 14px; fill: #555; }
      .frame-title { font-size: 16px; fill: #333; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="1700" fill="#F4F1F8"/>

  <!-- Frame 1: 相册首页（空状态） -->
  <g transform="translate(40,40)">
    <text class="frame-title" x="0" y="0">① 相册首页 · 空状态（首次使用）</text>
    <rect class="device" x="0" y="20" width="360" height="640" rx="20"/>
    <rect class="bg" x="2" y="22" width="356" height="636" rx="18"/>
    <!-- status bar -->
    <rect class="surface" x="2" y="22" width="356" height="28" rx="18"/>
    <text class="label" x="20" y="40">9:41</text>
    <text class="label" x="316" y="40">📶 100%</text>
    <!-- top app bar -->
    <rect x="2" y="50" width="356" height="56" fill="#FEF7FF"/>
    <text class="titleM" x="20" y="86">相册</text>
    <text x="320" y="86" font-size="20" fill="#49454F">⚙</text>
    <!-- empty content -->
    <text x="180" y="280" text-anchor="middle" class="titleM">还没有相册</text>
    <text x="180" y="312" text-anchor="middle" class="bodyS">添加一个 WebDAV 路径，开始浏览</text>
    <rect x="100" y="350" width="160" height="44" rx="22" class="primary"/>
    <text x="180" y="378" text-anchor="middle" font-size="14" fill="#FFFFFF">+ 添加相册</text>
    <!-- FAB -->
    <circle cx="318" cy="610" r="28" class="primary"/>
    <text x="318" y="619" text-anchor="middle" font-size="26" fill="#FFFFFF">+</text>
  </g>

  <!-- Frame 2: 相册首页（有相册） -->
  <g transform="translate(440,40)">
    <text class="frame-title" x="0" y="0">② 相册首页 · 已有几个相册</text>
    <rect class="device" x="0" y="20" width="360" height="640" rx="20"/>
    <rect class="bg" x="2" y="22" width="356" height="636" rx="18"/>
    <rect class="surface" x="2" y="22" width="356" height="28" rx="18"/>
    <text class="label" x="20" y="40">9:41</text>
    <text class="label" x="316" y="40">📶 100%</text>
    <rect x="2" y="50" width="356" height="56" fill="#FEF7FF"/>
    <text class="titleM" x="20" y="86">相册</text>
    <text x="320" y="86" font-size="20" fill="#49454F">⚙</text>

    <!-- list items -->
    <g transform="translate(0,120)">
      <text class="titleS" x="20" y="0">家庭照片</text>
      <text class="bodyS" x="20" y="22">/Photos/Family</text>
      <line class="divider" x1="20" y1="44" x2="340" y2="44"/>
      <text class="titleS" x="20" y="74">旅行</text>
      <text class="bodyS" x="20" y="96">/Photos/Travel/2024</text>
      <line class="divider" x1="20" y1="118" x2="340" y2="118"/>
      <text class="titleS" x="20" y="148">表情包</text>
      <text class="bodyS" x="20" y="170">/Backup/Memes</text>
      <line class="divider" x1="20" y1="192" x2="340" y2="192"/>
    </g>

    <circle cx="318" cy="610" r="28" class="primary"/>
    <text x="318" y="619" text-anchor="middle" font-size="26" fill="#FFFFFF">+</text>
  </g>

  <!-- Frame 3: 添加相册弹窗 -->
  <g transform="translate(840,40)">
    <text class="frame-title" x="0" y="0">③ 添加相册弹窗</text>
    <rect class="device" x="0" y="20" width="360" height="640" rx="20"/>
    <rect class="bg" x="2" y="22" width="356" height="636" rx="18"/>
    <rect fill="rgba(0,0,0,0.45)" x="2" y="22" width="356" height="636" rx="18"/>
    <!-- dialog -->
    <rect class="surface" x="20" y="160" width="320" height="380" rx="16"/>
    <text class="titleM" x="40" y="200">添加相册</text>

    <!-- path field + browse -->
    <rect x="40" y="220" width="200" height="48" rx="6" class="outline"/>
    <text class="label" x="50" y="214">WebDAV 路径（例如 /Photos/Family）</text>
    <text class="body" x="50" y="250">/Photos/Family</text>
    <rect x="248" y="220" width="92" height="48" rx="6" fill="none" stroke="#6750A4" stroke-width="1"/>
    <text x="294" y="250" text-anchor="middle" font-size="14" fill="#6750A4">浏览…</text>
    <text class="bodyS" x="40" y="290">应用会递归读取该路径下的所有媒体</text>

    <!-- name field -->
    <rect x="40" y="310" width="300" height="48" rx="6" class="outline"/>
    <text class="label" x="50" y="304">相册名称</text>
    <text class="body" x="50" y="340">家庭照片</text>

    <!-- buttons -->
    <text x="220" y="510" font-size="14" fill="#6750A4">取消</text>
    <text x="290" y="510" font-size="14" fill="#6750A4">保存</text>
  </g>

  <!-- Frame 4: 目录选择器 -->
  <g transform="translate(40,720)">
    <text class="frame-title" x="0" y="0">④ WebDAV 目录选择器（像文件浏览器）</text>
    <rect class="device" x="0" y="20" width="360" height="640" rx="20"/>
    <rect class="bg" x="2" y="22" width="356" height="636" rx="18"/>
    <rect class="surface" x="2" y="22" width="356" height="28" rx="18"/>
    <text class="label" x="20" y="40">9:41</text>
    <text class="label" x="316" y="40">📶 100%</text>
    <rect x="2" y="50" width="356" height="56" fill="#FEF7FF"/>
    <text x="20" y="86" font-size="20" fill="#49454F">←</text>
    <text class="titleM" x="60" y="86">选择 WebDAV 路径</text>

    <text class="body" x="20" y="140">/Photos/Family/2024</text>

    <rect x="20" y="160" width="320" height="44" rx="22" class="primary"/>
    <text x="180" y="188" text-anchor="middle" font-size="14" fill="#FFFFFF">选择当前目录</text>

    <rect x="20" y="216" width="320" height="40" rx="20" fill="none" stroke="#6750A4" stroke-width="1"/>
    <text x="180" y="241" text-anchor="middle" font-size="14" fill="#6750A4">↑ 上一级</text>

    <g transform="translate(0,280)">
      <text class="body" x="20" y="22">📁  Beach</text>
      <line class="divider" x1="20" y1="44" x2="340" y2="44"/>
      <text class="body" x="20" y="74">📁  Mountain</text>
      <line class="divider" x1="20" y1="96" x2="340" y2="96"/>
      <text class="body" x="20" y="126">📁  Roadtrip</text>
      <line class="divider" x1="20" y1="148" x2="340" y2="148"/>
      <text class="body" x="20" y="178">📁  Sakura</text>
      <line class="divider" x1="20" y1="200" x2="340" y2="200"/>
    </g>
  </g>

  <!-- Frame 5: 相册详情 -->
  <g transform="translate(440,720)">
    <text class="frame-title" x="0" y="0">⑤ 相册详情 · 按原文件夹分段</text>
    <rect class="device" x="0" y="20" width="360" height="640" rx="20"/>
    <rect class="bg" x="2" y="22" width="356" height="636" rx="18"/>
    <rect class="surface" x="2" y="22" width="356" height="28" rx="18"/>
    <text class="label" x="20" y="40">9:41</text>
    <text class="label" x="316" y="40">📶 100%</text>
    <rect x="2" y="50" width="356" height="56" fill="#FEF7FF"/>
    <text x="20" y="86" font-size="20" fill="#49454F">←</text>
    <text class="titleM" x="60" y="86">家庭照片</text>
    <text x="324" y="86" font-size="20" fill="#49454F">⟳</text>

    <text class="bodyS" x="20" y="120">正在读取 WebDAV…  已扫描 3 个目录</text>

    <!-- section 1 -->
    <text class="titleS" x="20" y="150">根目录</text>
    <text class="bodyS" x="20" y="170">4 个文件</text>
    <g transform="translate(16,180)">
      <rect class="surfaceVariant" x="0"  y="0" width="100" height="100" rx="6"/>
      <rect class="surfaceVariant" x="108" y="0" width="100" height="100" rx="6"/>
      <rect class="surfaceVariant" x="216" y="0" width="100" height="100" rx="6"/>
      <text x="92" y="94" font-size="11" fill="#1D1B20">GIF</text>
    </g>

    <!-- section 2 -->
    <text class="titleS" x="20" y="320">2024/Trip</text>
    <text class="bodyS" x="20" y="340">6 个文件</text>
    <g transform="translate(16,350)">
      <rect class="surfaceVariant" x="0"   y="0" width="100" height="100" rx="6"/>
      <rect class="surfaceVariant" x="108" y="0" width="100" height="100" rx="6"/>
      <rect class="surfaceVariant" x="216" y="0" width="100" height="100" rx="6"/>
      <text x="200" y="94" font-size="11" fill="#1D1B20">▶</text>
      <rect class="surfaceVariant" x="0"   y="108" width="100" height="100" rx="6"/>
      <rect class="surfaceVariant" x="108" y="108" width="100" height="100" rx="6"/>
      <rect class="surfaceVariant" x="216" y="108" width="100" height="100" rx="6"/>
    </g>
  </g>

  <!-- Frame 6: 设置 -->
  <g transform="translate(840,720)">
    <text class="frame-title" x="0" y="0">⑥ 设置</text>
    <rect class="device" x="0" y="20" width="360" height="640" rx="20"/>
    <rect class="bg" x="2" y="22" width="356" height="636" rx="18"/>
    <rect class="surface" x="2" y="22" width="356" height="28" rx="18"/>
    <text class="label" x="20" y="40">9:41</text>
    <text class="label" x="316" y="40">📶 100%</text>
    <rect x="2" y="50" width="356" height="56" fill="#FEF7FF"/>
    <text x="20" y="86" font-size="20" fill="#49454F">←</text>
    <text class="titleM" x="60" y="86">设置</text>

    <text class="titleS" x="20" y="140">账号</text>
    <text class="body"   x="20" y="170">家里 NAS</text>
    <text class="bodyS"  x="20" y="192">https://dav.example.com/photos</text>
    <text class="bodyS"  x="20" y="212">根路径：/</text>

    <line class="divider" x1="16" y1="236" x2="344" y2="236"/>

    <text class="titleS" x="20" y="270">浏览方式</text>
    <circle cx="32" cy="296" r="8" fill="#6750A4"/>
    <text class="body" x="48" y="302">相册（默认）</text>
    <circle cx="32" cy="328" r="8" fill="none" stroke="#79747E" stroke-width="2"/>
    <text class="body" x="48" y="334">按目录浏览（旧版）</text>

    <line class="divider" x1="16" y1="360" x2="344" y2="360"/>

    <text class="titleS" x="20" y="392">本地缓存</text>
    <text class="body"   x="20" y="420">本地缩略图占用：12.4 MB</text>
    <rect x="20" y="438" width="180" height="44" rx="22" class="primary"/>
    <text x="110" y="466" text-anchor="middle" font-size="14" fill="#FFFFFF">清除本地缩略图</text>
  </g>

  <!-- Footer note -->
  <text x="40" y="1430" class="caption">
    模拟图。Material3 默认主题 + 默认动态色（系统未启用动态色时是这个紫）。中文文案 = 代码实际写死的字。控件大小和顺序按当前源码画。
  </text>
  <text x="40" y="1455" class="caption">
    实际真机上会跟随系统：开了 Material You 动态色就会取系统壁纸的主色；浅色/深色模式自动跟随；中文字体看系统。
  </text>
  <text x="40" y="1500" class="caption">
    没做的：自定义图标 / 启动画面 / 自家配色。这些都用 Compose Material3 的默认值。
  </text>
</svg>
